name: CI

on:
  push:
  pull_request:

jobs:
  skills-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install numpy

      - name: Run skill tests
        shell: bash
        run: |
          python skills/1start-mathmodel/scripts/test_project_guard.py
          python skills/1start-mathmodel/scripts/test_task_versions.py
          python skills/6verity/tests/test_integrity_check.py
          python skills/6verity/tests/test_validate_workbook.py
          python skills/6verity/tests/test_submission_bundle.py
          python skills/7benchmark-mathmodel/tests/test_benchmark_seal.py
          python skills/3coding-visual/tests/test_matlab_runner.py
          python skills/3coding-visual/tests/test_matlab_agentic_status.py
          python skills/5writing/tests/test_writing_team.py
          python skills/mathmodel-spatial/tests/test_spatial_audit.py
          python skills/mathmodel-algorithm-lab/tests/test_algorithm_lab.py
          python skills/mathmodel-literature-research/tests/test_validate_literature_bundle.py
          python skills/mathmodel-orchestrator/tests/test_agent_protocol.py
          python skills/2analysis-modeling/tests/test_contract_lint.py
          python skills/1start-mathmodel/tests/test_time_tracker.py

      - name: Validate writing templates
        shell: bash
        run: |
          python skills/5writing/scripts/validate_templates.py
          python skills/5writing/scripts/sanitize_reference_templates.py skills/5writing/templates --check

      # MATLAB/Octave is not installed on the runner. The runner reports
      # "available: false" and exits 1, which we treat as a non-failure.
      # `|| exit 0` is bash syntax; declare bash explicitly because the
      # windows-latest default shell (PowerShell) cannot parse it.
      - name: Check MATLAB/Octave availability
        shell: bash
        run: python skills/3coding-visual/scripts/matlab_runner.py --check || exit 0

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint backend with ruff
        run: |
          cd backend
          ruff check app/

      - name: Syntax-check backend
        run: python -m compileall backend/app

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n writing_check.sh
        run: bash -n skills/6verity/scripts/writing_check.sh
